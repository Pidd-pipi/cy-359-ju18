name: orienteering

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-orienteering}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-orienteering_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orienteering_pwd}
      POSTGRES_DB: ${DB_NAME:-orienteering_db}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-44004}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orienteering_user} -d ${DB_NAME:-orienteering_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-orienteering}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-46304}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-orienteering}-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      BACKEND_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-orienteering_db}
      DB_USER: ${DB_USER:-orienteering_user}
      DB_PASSWORD: ${DB_PASSWORD:-orienteering_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRE_HOURS: "72"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
    ports:
      - "${BACKEND_PORT:-29519}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-orienteering}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28519}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
